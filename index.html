<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
  <title>KinoPub</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <!-- Вход: логин и пароль от kino.watch -->
  <section id="screen-login" class="screen">
    <div class="login-left">
      <div class="logo">KinoPub</div>
      <p class="login-hint">Войдите с логином и паролем от kino.watch</p>
      <div class="field focusable" id="login-user" data-field="user"><span class="field-label">Логин или e-mail</span><span class="field-value"></span></div>
      <div class="field focusable" id="login-pass" data-field="pass"><span class="field-label">Пароль</span><span class="field-value"></span></div>
      <div class="field focusable hidden" id="login-code" data-field="code"><span class="field-label">Код из письма от kino.watch</span><span class="field-value"></span></div>
      <button class="btn focusable" id="login-show">Показать пароль</button>
      <button class="btn focusable hidden" id="login-resend">Выслать новый код</button>
      <button class="btn focusable primary" id="login-go">Войти</button>
      <p class="login-status" id="login-status"></p>
      <p class="login-note">Пароль уходит только на ваш прокси и на kino.watch и на телевизоре не сохраняется. После входа телевизор хранит лишь cookie сайта.</p>
    </div>
    <div class="login-right">
      <div class="osk" id="login-osk"></div>
    </div>
  </section>

  <!-- Главная: ряды плиток -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <span class="logo small">KinoPub</span>
      <nav class="topnav">
        <button class="btn focusable" data-action="search">Поиск</button>
        <button class="btn focusable" data-action="section" data-path="/movie">Фильмы</button>
        <button class="btn focusable" data-action="section" data-path="/serial">Сериалы</button>
        <button class="btn focusable" data-action="section" data-path="/anime">Аниме</button>
        <button class="btn focusable" data-action="section" data-path="/documovie">Доку</button>
        <button class="btn focusable" data-action="section" data-path="/docuserial">Докусериалы</button>
        <button class="btn focusable" data-action="section" data-path="/concert">Концерты</button>
        <button class="btn focusable" data-action="section" data-path="/tvshow">ТВ-шоу</button>
        <button class="btn focusable" data-action="history">История</button>
        <button class="btn focusable" data-action="bookmarks">Закладки</button>
        <button class="btn focusable icon" data-action="settings" title="Настройки"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </nav>
    </header>
    <div id="home-rows" class="rows"></div>
  </section>

  <!-- Сетка: раздел каталога, папка закладок, история -->
  <section id="screen-section" class="screen">
    <header class="topbar">
      <span class="logo small" id="section-title">Фильмы</span>
      <nav class="topnav" id="section-sorts">
        <button class="btn focusable" data-order="updated">Обновлённые</button>
        <button class="btn focusable" data-order="added">Новые</button>
        <button class="btn focusable" data-order="views">Популярные</button>
        <button class="btn focusable" data-order="kinopoisk">Кинопоиск</button>
        <button class="btn focusable" data-order="imdb">IMDb</button>
      </nav>
    </header>
    <div id="section-grid" class="grid"></div>
  </section>

  <!-- Закладки: список папок -->
  <section id="screen-bookmarks" class="screen">
    <header class="topbar"><span class="logo small">Закладки</span></header>
    <div id="bookmarks-list" class="folder-list"></div>
  </section>

  <!-- Поиск с экранной клавиатурой -->
  <section id="screen-search" class="screen">
    <div class="search-left">
      <div class="search-input" id="search-input"><span class="caret">|</span></div>
      <div class="osk" id="search-osk"></div>
    </div>
    <div class="search-right">
      <div id="search-grid" class="grid"></div>
    </div>
  </section>

  <!-- Карточка фильма/сериала -->
  <section id="screen-item" class="screen">
    <div class="item-bg" id="item-bg"></div>
    <div class="item-body">
      <div class="item-poster"><img id="item-poster" alt=""></div>
      <div class="item-info" id="item-info">
        <h1 id="item-title"></h1>
        <div class="item-orig" id="item-orig"></div>
        <div class="item-meta" id="item-meta"></div>
        <div class="item-badges" id="item-badges"></div>
        <p class="item-plot" id="item-plot"></p>
        <p class="item-cast" id="item-cast"></p>
        <div class="item-actions" id="item-actions"></div>
        <div class="seasons" id="item-seasons"></div>
        <div class="episodes" id="item-episodes"></div>
        <div class="item-similar" id="item-similar"><div class="row-title">Похожие</div><div class="row-items" id="item-similar-row"></div></div>
      </div>
    </div>
    <div class="overlay" id="item-overlay"></div>
  </section>

  <!-- Плеер -->
  <section id="screen-player" class="screen">
    <video id="video" preload="auto"></video>
    <div class="player-osd" id="player-osd">
      <div class="osd-top">
        <img class="osd-poster" id="osd-poster" alt="">
        <div class="osd-meta">
          <div class="osd-title" id="osd-title"></div>
          <div class="osd-sub" id="osd-orig"></div>
          <div class="osd-sub" id="osd-year"></div>
          <div class="osd-sub" id="osd-ep"></div>
        </div>
        <button class="ctl focusable osd-close" data-ctl="back" title="Выход"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="osd-center">
        <button class="ctl focusable round" data-ctl="rew" title="−10 с"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 3.5v5h5"/></svg></button>
        <button class="ctl focusable round huge" data-ctl="play" id="ctl-play" title="Пауза">❚❚</button>
        <button class="ctl focusable round" data-ctl="ff" title="+10 с"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v5h-5"/></svg></button>
      </div>
      <div class="osd-bottom">
        <div class="osd-bar focusable" id="osd-bar"><div class="osd-fill" id="osd-fill"><i class="osd-knob"></i></div></div>
        <div class="osd-panel">
          <button class="ctl focusable" data-ctl="prev" id="ctl-prev" title="Предыдущая серия"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14L8 12z"/><path d="M6 5v14"/></svg></button>
          <button class="ctl focusable" data-ctl="play" id="ctl-play2" title="Пауза">❚❚</button>
          <button class="ctl focusable" data-ctl="next" id="ctl-next" title="Следующая серия"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14l10-7z"/><path d="M18 5v14"/></svg></button>
          <span class="osd-time"><span id="osd-cur">0:00</span> / <span id="osd-dur">0:00</span></span>
          <span class="osd-right">
            <button class="ctl focusable" data-ctl="episodes" id="ctl-episodes" title="Серии"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="3"/></svg></button>
            <button class="ctl focusable" data-ctl="subs" id="ctl-subs" title="Звук и субтитры"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M10.5 10.2a2.3 2.3 0 1 0 0 3.6M17 10.2a2.3 2.3 0 1 0 0 3.6"/></svg></button>
            <button class="ctl focusable" data-ctl="menu" id="ctl-menu" title="Настройки"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
          </span>
        </div>
        <div class="osd-info" id="osd-info"></div>
      </div>
    </div>
    <div class="player-menu" id="player-menu"></div>
    <div class="player-msg" id="player-msg"></div>
  </section>

  <!-- Настройки -->
  <section id="screen-settings" class="screen">
    <div class="settings-box" id="settings-box"></div>
  </section>

  <div id="toast" class="toast"></div>
  <div id="loader" class="loader">Загрузка…</div>

  <script src="config.js?v=14"></script>
  <script src="parser.js?v=14"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
